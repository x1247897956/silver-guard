name: eval-gate

# 评测门禁：指标相对基线掉线即 fail。
#
# 设计说明（很重要，决定了这个门禁可信不可信）：
#   1. **A 组规则基线不需要模型**，所以这一层门禁在 CI 里
#      永远能跑（哪怕没有 API key）。它拦的是"数据/策略/规则被改坏"。
#   2. 当仓库配置了 secret `DEEPSEEK_API_KEY` 时，额外跑一层**全链路门禁**，
#      比对 D 组（Agent + 长期记忆）的 PIR / FPR-L3 —— 这一层才拦得住
#      "prompt 或策略改动导致的真实回退"。
#   3. 没有 key 时明确输出"跳过全链路门禁"，**不假装跑过**。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  rule-gate:
    name: 规则门禁（A 组，零模型调用）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - name: 与基线比对（IR / PIR / FPR-L3）
        run: |
          uv run python -m silverguard.runner \
            --configs rule --split dev --ci-subset --no-traces \
            --json-out data/eval-ci-rule.json \
            --baseline eval/baseline.json --gate

  full-gate:
    name: 全链路门禁（D 组，需 DEEPSEEK_API_KEY）
    runs-on: ubuntu-latest
    needs: rule-gate
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync
      - name: 检查 secret
        id: key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 DEEPSEEK_API_KEY，跳过全链路门禁（不假装跑过）"
          fi
      - name: 写 .env（只存在于 runner 的临时机器上）
        if: steps.key.outputs.have == 'yes'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: printf 'DEEPSEEK_API_KEY=%s\nSILVERGUARD_MODEL=deepseek-chat\n' "$DEEPSEEK_API_KEY" > .env
      - name: 全链路评测 + 基线比对（D 组）
        if: steps.key.outputs.have == 'yes'
        run: |
          uv run python -m silverguard.runner \
            --configs agent_memory --split dev --ci-subset --no-traces \
            --json-out data/eval-ci-full.json \
            --baseline eval/baseline-ci.json --gate
      - name: 上传评测产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: data/eval-ci-*.json
          if-no-files-found: ignore
