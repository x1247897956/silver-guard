# 已知话术规则表（check_fraud_pattern 的确定性规则层）
#
# 说明：这里是**规则层**，刻意做得"不够聪明"——它只看字面特征。
# 它存在的意义有两个：
#   ① 它是消融实验 A（规则基线）的实现，也是 C/D 里被真正调用的工具之一；
#   ② 它会被高难负样本打脸（正常家属转账 / 家属要求保密），
#      这正是"为什么需要证据抽取而不是关键词匹配"的实验证据。
#
# 规则只描述**诱导话术层的特征词**，不含任何作案细节。

version: "2026-09-27.1"

patterns:
  - id: fp_identity_unverifiable
    desc: 无法核验的身份自称（公检法/官方机构/平台客服）
    weight: 2
    regex:
      - "(公安|警察|派出所|检察院|法院|经侦|刑侦|反诈中心)"
      - "(客服|官方|平台|中心|工作人员|专员|经理)[^。！？]{0,6}(吗|您好|为您|通知)"
      - "(银保监|金融监管|人民银行|社保局|医保局|老龄)"

  - id: fp_secrecy_request
    desc: 要求对家人/外人保密
    weight: 2
    regex:
      # 指定对象：家人 / 子女 / 亲属
      - "(别|不要|不用|先别|先不要|不能)[^。！？]{0,8}(告诉|跟|和)[^。！？]{0,8}(家人|子女|儿子|女儿|老伴|孩子|孩|爸|妈|家里)"
      # 泛指对象：任何人 / 别人 / 任何人都不行
      - "(别|不要|不用|先别|先不要|不能|不可以)[^。！？]{0,4}(告诉|跟|和|对)[^。！？]{0,4}(任何人|别人|其他人|外人)"
      - "(保密|越少人知道|越少人知道越好|不能外传|别外传|不要声张|不要声张|不要外传)"
      - "(这事|这个事|这件事)[^。！？]{0,6}(别|不要|不能)[^。！？]{0,6}(说|讲|提)"

  - id: fp_urgency_pressure
    desc: 限时 / 恐吓 / 不许挂断
    weight: 1
    regex:
      - "(今天|马上|立刻|限时|下午|几点前|最后|就这一次)[^。！？]{0,10}(截止|过期|办理|处理|操作为止)"
      - "(不许|不能|别)[^。！？]{0,4}挂断"
      - "(抓|拘留|起诉|立案|坐牢|逮捕|通缉|影响征信|冻结)"

  - id: fp_money_action
    desc: 资金动作（转账 / 验证码 / 屏幕共享）
    weight: 2
    regex:
      - "(转|打|汇|存|缴)[^。！？]{0,6}(钱|款|账|过去|进来|到|万|元|整)"
      - "(验证码|短信码|动态码|密码)"
      - "(共享|看一下)屏(幕|幕吗)"
      - "(安全账户|核查账户|保证金|押金|手续费|解冻费|担保金)"

  - id: fp_channel_anomaly
    desc: 陌生渠道异常（换号 / 陌生链接 / 非官方渠道）
    weight: 1
    regex:
      - "(换了|换号|这是|用的是|借)[^。！？]{0,6}(号|同事的手机|别人的手机)"
      - "(下载|安装|点击|打开)[^。！？]{0,8}(链接|App|APP|软件|小程序)"
      - "(陌生号|私人号|新号|工作号|临时号)"

  - id: fp_high_return_lure
    desc: 高收益 / 内部名额 / 返利诱导
    weight: 2
    regex:
      - "(年化|月收益|保本|稳赚|内部|名额|额度|返|分红|利息)"
      - "(补贴|补助|理赔|赔付|退税|退款)[^。！？]{0,8}(领取|办理|到账|返还)"

  - id: fp_authorized_claim
    desc: 声称已获授权（对守护方的话术）
    weight: 2
    regex:
      - "(已经同意|都同意|本人同意|家里人同意|家属同意)"
      - "(你可以|你按|直接)[^。！？]{0,6}(协助|配合|办理|操作)"
      - "(关闭|关掉|取消)[^。！？]{0,6}(提醒|守护|预警|安全提示)"

  - id: fp_privilege_lure
    desc: 索要家属联系方式 / 诱导越权
    weight: 3
    regex:
      - "(联系|通知)[^。！？]{0,4}(方式|电话|号码)[^。！？]{0,6}(给|发|告诉)"
      - "(把|将)[^。！？]{0,6}(家属|子女|亲人)[^。！？]{0,4}(电话|联系方式|号码)"
      - "(你|您)[^。！？]{0,4}(帮我|替我)[^。！？]{0,4}(联系|通知)"
